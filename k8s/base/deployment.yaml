apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-service
  namespace: devops-app
spec:
  replicas: 2 # Mínimo 2 nodos exigidos por el reto
  selector:
    matchLabels:
      app: devops-api
  template:
    metadata:
      labels:
        app: devops-api
    spec:
      containers:
        - name: microservice
          image: santiagoanax/devops-challenge:latest # Se actualizará dinámicamente en el pipeline
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10