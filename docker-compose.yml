version: '3.8'

services:
  devops-app-1:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: devops-service-node1
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOGGING_LEVEL_COM_ANAX_DEVOPS=DEBUG
    restart: unless-stopped

  devops-app-2:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: devops-service-node2
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOGGING_LEVEL_COM_ANAX_DEVOPS=DEBUG
    restart: unless-stopped

  nginx-load-balancer:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - devops-app-1
      - devops-app-2
    restart: unless-stopped