name: "Main Orchestrator Reto DevOps Platform"

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'instalations/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "dev" ]
    # También aplicar filtros en PR para ser consistentes
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'instalations/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch: # Permite ejecuciones bajo demanda exigidas en el reto

jobs:
  # 1. CI: Se ejecuta siempre (main y dev)
  Pipeline-CI:
    name: "Stage 1 — Continuous Integration"
    uses: ./.github/workflows/ci.yml
    secrets: inherit # CRITICO: Esto inyecta credenciales de SonarCloud (pasa todos los secrets)

  # 2. Docker: Se ejecuta solo si CI pasa. (main y dev)
  Pipeline-Docker:
    name: "Stage 2 — Docker Build & Security Scan"
    needs: Pipeline-CI
    uses: ./.github/workflows/docker.yml
    secrets: inherit # Inyecta DOCKERHUB_USERNAME y TOKEN

  # 3. CD: Solo en MAIN, solo en PUSH (merge) y si Docker pasó.
  Pipeline-CD:
    name: "Stage 3 — Continuous Deployment to AWS"
    needs: Pipeline-Docker
    # Condición: Solo rama main Y que sea un push (no PR) o disparo manual
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/cd.yml
    secrets: inherit # Inyecta AWS_ACCESS_KEY, SSH_PRIVATE_KEY, etc.