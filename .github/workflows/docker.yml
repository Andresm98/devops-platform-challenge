name: "Docker Containerization & Vulnerability Scan"

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch: # Permite ejecuciones bajo demanda exigidas en el reto

jobs:
  build-and-secure-image:
    name: "Docker Build, Trivy Scan & Push"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Construir la imagen localmente para ser escaneada
      - name: Build Local Image for Security Auditing
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          tags: andy17u7/devops-challenge:${{ github.sha }}
          load: true # Carga la imagen localmente para que Trivy pueda inspeccionarla

      # 2. Escaneo de vulnerabilidades con Trivy (Shift-Left Security)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: andy17u7/devops-challenge:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Rompe el pipeline si hay algo CRÍTICO
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # 3. Login usando Secrets configurados
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Push final solo si Trivy no encuentra problemas
      - name: Push Production-Ready Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            andy17u7/devops-challenge:latest
            andy17u7/devops-challenge:${{ github.sha }}