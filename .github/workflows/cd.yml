name: "Continuous Deployment to AWS Production"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'instalations/**'
      - '.gitignore'
      - 'LICENSE'

  workflow_dispatch:

jobs:
  infrastructure-and-delivery:
    name: "Terraform Apply & K8s Continuous Delivery"
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Initialization & Apply
        run: |
          cd terraform/environments/prod
          terraform init
          terraform apply -auto-approve

      - name: Capture EC2 Live Public IP
        id: get_ip
        run: |
          cd terraform/environments/prod
          IP=$(terraform output -raw k3s_server_ip)
          echo "server_ip=$IP" >> $GITHUB_OUTPUT

      # -------------------------
      # WAIT FOR SSH
      # -------------------------
      - name: Wait for SSH to be ready
        run: |
          IP=${{ steps.get_ip.outputs.server_ip }}
          echo "Waiting for SSH on $IP..."
          for i in {1..40}; do
            nc -z $IP 22 && echo "SSH ready" && break
            echo "SSH not ready yet... attempt $i"
            sleep 15
          done

      # -------------------------
      # VERIFY K3S API READY
      # -------------------------
      - name: Wait for Kubernetes API
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.get_ip.outputs.server_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            echo "Waiting for K3s..."
            for i in {1..40}; do
              sudo k3s kubectl get nodes && echo "K3s READY" && exit 0
              echo "K3s not ready yet... attempt $i"
              sleep 15
            done
            exit 1

      # -------------------------
      # DEPLOYMENT
      # -------------------------
      - name: Deploy to K3s Cluster
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.get_ip.outputs.server_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e

            # 0. Namespace seguro
            sudo k3s kubectl create namespace devops-app || true

            # 1. Kong — Instalación oficial DB-less controlada
            sudo k3s kubectl apply -f https://raw.githubusercontent.com/Kong/kubernetes-ingress-controller/v2.12.0/deploy/single/all-in-one-dbless.yaml

            # 2. Descarga limpia del manifiesto del repositorio
            rm -rf devops-platform-challenge
            git clone https://github.com/${{ github.repository }}.git

            cd devops-platform-challenge/k8s/base

            # 3. Sustitución atómica de la imagen taggeada con el SHA del Commit
            sed -i "s|image: andy17u7/devops-challenge:latest|image: andy17u7/devops-challenge:${{ github.sha }}|g" deployment.yaml

            # 4. Despliegue declarativo mediante Kustomize
            sudo k3s kubectl apply -k .

            # 5. Despliegue de Observabilidad (Prometheus + Grafana)
            if [ -f ../monitoring.yaml ]; then
              sudo k3s kubectl apply -f ../monitoring.yaml
            fi

            # 6. Compuerta de seguridad: Esperar el correcto Rollout con tolerancia de tiempo
            sudo k3s kubectl rollout status deployment/devops-service -n devops-app --timeout=5m

      # -------------------------
      # TESTING CONFIGURATION
      # -------------------------
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Testing Dependencies
        run: |
          pip install requests python-dotenv

      # FORMULACIÓN CORRECTA DE CAPTURA:
      # Ejecutar el comando remoto por SSH, y extraer la salida de vuelta al entorno del runner de GitHub.
      - name: Capture Kong Proxy Live Port Externally
        id: capture_kong_port
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.get_ip.outputs.server_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            # 1. Intentar capturar el NodePort público asignado al puerto HTTP 80 de Kong
            NODE_PORT=$(sudo k3s kubectl get svc kong-proxy -n kong -o jsonpath='{.spec.ports[?(@.port==80)].nodePort}')
            
            # 2. Si por configuración de K3s se expone directo en puerto de host, usar puerto 80 por defecto
            if [ -z "$NODE_PORT" ]; then
              NODE_PORT="80"
            fi
            
            echo "Puerto real de escucha de Kong detectado: $NODE_PORT"
            
            # Salvar el valor en un archivo temporal dentro de la EC2 para leerlo desde el exterior si es necesario, 
            # pero para pasarlo a GitHub de forma nativa sera impreso con un formato clave
            echo "PORT_FOUND=$NODE_PORT" > /tmp/kong_port.txt

      # Paso puente para jalar el valor del archivo temporal de la EC2 hacia las variables del Runner de GitHub
      - name: Sync Port Variable to GitHub Runner
        id: sync_port
        run: |
          IP="${{ steps.get_ip.outputs.server_ip }}"
          
          # Crear el archivo de llave privada en el runner temporalmente para hacer una consulta rápida por SSH estándar
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          # Extraee el contenido del puerto remoto directamente a un output del runner
          REMOTE_PORT=$(ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$IP "cat /tmp/kong_port.txt | cut -d'=' -f2")
          echo "detected_port=$REMOTE_PORT" >> $GITHUB_OUTPUT
          
          rm -f private_key.pem

      # -------------------------
      # SMOKE TEST EJECUCIÓN SANEADA
      # -------------------------
      - name: Execute Automated Smoke Test (E2E Verification)
        env:
          APP_HOST: ${{ steps.get_ip.outputs.server_ip }}
          APP_PORT: ${{ steps.sync_port.outputs.detected_port }}
          API_KEY: ${{ secrets.TEST_API_KEY }}
        run: |
          echo "--- EXECUTION INTEGRITY CHECK ---"
          echo "Target Host: $APP_HOST"
          echo "Target Port: $APP_PORT (Kong API Gateway Perimetral)"
          echo "---------------------------------"
          python ./test_endpoint.py